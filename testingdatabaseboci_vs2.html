<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Visualisasi Spreadsheet (IndexedDB Support)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (xlsx) Library CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script>
        if (typeof XLSX === 'undefined') {
            document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>');
        }
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.03);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.15);
            border-radius: 3px;
        }
        mark {
            background-color: #fef08a;
            color: #854d0e;
            padding: 0 2px;
            border-radius: 2px;
        }
        table {
            table-layout: auto;
            width: 100% !important;
            border-collapse: collapse;
            font-size: 10px;
        }
        th, td {
            white-space: normal !important;
            word-wrap: break-word !important;
            word-break: break-word !important;
            overflow-wrap: break-word !important;
            line-height: 1.15;
            padding: 3px 2px !important;
        }
        th {
            position: relative;
            overflow: visible !important;
            vertical-align: bottom !important;
            background-color: #f1f5f9;
        }
        .header-title-stack {
            display: block;
            white-space: normal !important;
            word-break: break-word !important;
            overflow-wrap: break-word !important;
            text-align: center;
            line-height: 1.05;
            font-size: 10px;
            font-weight: 700;
        }
        .col-resizable {
            min-width: 130px !important;
            max-width: 280px;
            text-align: left !important;
            vertical-align: middle;
        }
        .col-standard {
            min-width: 38px !important;
            max-width: 85px;
            text-align: center !important;
            vertical-align: middle;
        }
        .resizer {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            cursor: col-resize;
            user-select: none;
            touch-action: none;
            z-index: 10;
        }
        .resizer:hover, .resizing {
            background-color: rgba(34, 197, 94, 0.5);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200 font-sans">

    <!-- ================= HALAMAN LOGIN ================= -->
    <div id="loginPage" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-3">
        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl w-full max-w-sm p-5 space-y-4">
            <div class="text-center space-y-1">
                <div class="inline-flex bg-emerald-600 text-white p-2.5 rounded-xl shadow-md mb-1">
                    <i class="fa-solid fa-file-excel text-lg"></i>
                </div>
                <h2 class="text-sm font-bold text-slate-800 dark:text-white">SheetVision Portal</h2>
                <p class="text-[10px] text-slate-500 dark:text-slate-400">Silakan masuk untuk mengakses sistem</p>
            </div>

            <div class="space-y-3">
                <div class="grid grid-cols-2 gap-1 bg-slate-100 dark:bg-slate-900 p-1 rounded-lg">
                    <button type="button" onclick="switchLoginTab('admin')" id="tabAdminBtn" class="py-1 text-[10px] font-bold rounded-md bg-white dark:bg-slate-800 text-emerald-600 shadow-sm transition">Admin</button>
                    <button type="button" onclick="switchLoginTab('guest')" id="tabGuestBtn" class="py-1 text-[10px] font-bold rounded-md text-slate-500 hover:text-slate-800 transition">Pengunjung</button>
                </div>

                <div id="adminFormSection" class="space-y-2.5">
                    <div>
                        <label class="block text-[10px] font-semibold text-slate-600 dark:text-slate-300 mb-1">Password Admin</label>
                        <input type="password" id="adminPassword" placeholder="Masukkan password (default: admin123)" class="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-[11px] focus:outline-none focus:ring-1 focus:ring-emerald-500">
                    </div>
                    <button type="button" onclick="loginAsAdmin()" class="w-full py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-[11px] font-bold shadow-sm transition">
                        Masuk sebagai Admin
                    </button>
                </div>

                <div id="guestFormSection" class="hidden space-y-2.5">
                    <p class="text-[10px] text-slate-500 dark:text-slate-400 text-center py-2">Pengunjung dapat melihat data dan laporan yang sedang aktif pada sistem.</p>
                    <button type="button" onclick="loginAsGuest()" class="w-full py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-[11px] font-bold shadow-sm transition">
                        Masuk sebagai Pengunjung
                    </button>
                </div>

                <div id="loginErrorMsg" class="hidden text-[10px] text-red-500 text-center font-medium"></div>
            </div>
        </div>
    </div>

    <!-- ================= MODAL SETTING PASSWORD ADMIN ================= -->
    <div id="passwordModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-3">
        <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-2xl w-full max-w-sm p-5 space-y-3">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-700 pb-2">
                <h3 class="text-xs font-bold text-slate-800 dark:text-white flex items-center gap-1.5">
                    <i class="fa-solid fa-key text-emerald-600"></i> Pengaturan Password Admin
                </h3>
                <button onclick="closePasswordModal()" class="text-slate-400 hover:text-red-500 text-sm">&times;</button>
            </div>

            <div class="space-y-2.5">
                <div>
                    <label class="block text-[10px] font-semibold text-slate-600 dark:text-slate-300 mb-1">Password Lama</label>
                    <input type="password" id="oldPasswordInput" placeholder="Masukkan password lama" class="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-[11px] focus:outline-none focus:ring-1 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-600 dark:text-slate-300 mb-1">Password Baru</label>
                    <input type="password" id="newPasswordInput" placeholder="Masukkan password baru" class="w-full px-2.5 py-1.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-[11px] focus:outline-none focus:ring-1 focus:ring-emerald-500">
                </div>
                <div id="passwordAlertMsg" class="hidden text-[10px] font-medium text-center"></div>

                <div class="flex items-center justify-end gap-1.5 pt-2">
                    <button type="button" onclick="closePasswordModal()" class="px-3 py-1 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 rounded text-[10px] font-semibold">Batal</button>
                    <button type="button" onclick="saveNewPassword()" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-[10px] font-semibold shadow-sm">Simpan Password</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= APLIKASI UTAMA ================= -->
    <div id="mainApp" class="hidden min-h-screen flex flex-col">
        <!-- Header / Navbar -->
        <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
            <div class="w-full px-2.5 h-10 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="bg-emerald-600 text-white p-1 rounded shadow-sm">
                        <i class="fa-solid fa-file-excel text-xs"></i>
                    </div>
                    <div>
                        <h1 class="text-xs font-bold leading-tight">SheetVision 
                            <span id="userRoleBadge" class="text-[9px] px-1.5 py-0.2 rounded ml-1 font-normal"></span>
                        </h1>
                    </div>
                </div>
                <div class="flex items-center gap-1.5">
                    <button id="settingPasswordBtn" onclick="openPasswordModal()" class="hidden text-[10px] font-medium text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 border border-slate-200 dark:border-slate-600 px-2 py-0.5 rounded transition flex items-center gap-1" title="Ubah Password Admin">
                        <i class="fa-solid fa-key text-[8px] text-emerald-600"></i>
                        <span>Setting Password</span>
                    </button>

                    <button id="sampleBtn" onclick="loadSampleData()" class="text-[10px] font-medium text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/50 hover:bg-emerald-100 border border-emerald-200 px-2 py-0.5 rounded transition flex items-center gap-1">
                        <i class="fa-solid fa-wand-magic-sparkles text-[8px]"></i>
                        <span>Sampel Data</span>
                    </button>
                    <button id="themeToggle" onclick="toggleDarkMode()" class="p-1 text-slate-500 dark:text-slate-400 hover:bg-slate-100 rounded transition" title="Ganti Mode">
                        <i class="fa-solid fa-moon text-xs" id="themeIcon"></i>
                    </button>
                    <button onclick="logout()" class="text-[10px] text-red-600 bg-red-50 hover:bg-red-100 border border-red-200 px-2 py-0.5 rounded transition flex items-center gap-1" title="Keluar Akun">
                        <i class="fa-solid fa-right-from-bracket text-[8px]"></i>
                        <span>Keluar</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="w-full px-1.5 py-1 space-y-1 flex-1">

            <!-- Toolbar Upload & Ekspor -->
            <div id="adminToolbar" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-1 rounded-lg shadow-sm flex items-center justify-between gap-1 flex-wrap w-full">
                <div class="flex items-center gap-1">
                    <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" multiple class="hidden" onchange="handleFileSelect(event)">
                    <input type="file" id="jsonFileInput" accept=".json" class="hidden" onchange="handleJsonSelect(event)">

                    <button onclick="triggerFileInput()" class="px-2 py-0.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-[10px] font-semibold transition flex items-center gap-1 shadow-sm">
                        <i class="fa-solid fa-cloud-arrow-up text-[9px]"></i>
                        <span>Upload Excel</span>
                    </button>

                    <button onclick="triggerJsonInput()" class="px-2 py-0.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-[10px] font-semibold transition flex items-center gap-1 shadow-sm">
                        <i class="fa-solid fa-file-code text-[9px]"></i>
                        <span>Upload JSON</span>
                    </button>
                </div>

                <div class="flex items-center gap-1">
                    <button onclick="exportData('json')" class="px-2 py-0.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-[10px] font-semibold transition flex items-center gap-1 shadow-sm">
                        <i class="fa-solid fa-file-code text-[9px]"></i>
                        <span>JSON</span>
                    </button>
                    <button onclick="exportData('csv')" class="px-2 py-0.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 rounded text-[10px] font-semibold transition flex items-center gap-1">
                        <i class="fa-solid fa-file-csv text-emerald-600 text-[9px]"></i>
                        <span>CSV</span>
                    </button>
                    <button onclick="exportData('xlsx')" class="px-2 py-0.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-[10px] font-semibold transition flex items-center gap-1 shadow-sm">
                        <i class="fa-solid fa-file-excel text-[9px]"></i>
                        <span>Excel</span>
                    </button>
                    <button onclick="clearData()" class="p-0.5 px-1.5 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 rounded text-[10px] transition flex items-center justify-center" title="Reset Tampilan">
                        <i class="fa-solid fa-trash-can text-[9px]"></i>
                    </button>
                </div>
            </div>

            <!-- Status Alert -->
            <div id="statusAlert" class="hidden p-1.5 rounded text-[10px] font-medium"></div>

            <!-- AREA FILE & SHEET -->
            <div id="navBarContainer" class="hidden flex flex-col gap-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-1.5 rounded shadow-sm w-full">
                <div class="flex items-center gap-1.5 pb-1 border-b border-slate-100 dark:border-slate-700">
                    <div class="flex items-center gap-1 text-[10px] font-bold text-slate-700 dark:text-slate-200 shrink-0">
                        <i class="fa-solid fa-folder-open text-emerald-600"></i>
                        <span>Pilih File Excel:</span>
                    </div>
                    <select id="fileDropdown" onchange="onFileDropdownChange(event)" class="w-full max-w-md px-2 py-1 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded text-[10px] font-semibold focus:outline-none focus:ring-1 focus:ring-emerald-500">
                    </select>
                </div>

                <div class="flex items-center gap-1 flex-wrap pt-0.5 w-full" id="sheetTabs">
                </div>
            </div>

            <!-- Dashboard Content Area -->
            <div id="contentArea" class="hidden space-y-1 w-full">

                <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-1 rounded shadow-sm flex items-center gap-1.5 w-full">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-2 top-1/2 -translate-y-1/2 text-slate-400 text-[9px]"></i>
                        <input type="text" id="searchInput" oninput="onSearchInput()" placeholder="Cari data live..." class="w-full pl-6 pr-2 py-0.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded text-[10px] focus:outline-none focus:ring-1 focus:ring-emerald-500 transition">
                    </div>
                    <select id="columnFilter" onchange="applySearchAndFilter()" class="w-28 px-1 py-0.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded text-[9px] focus:outline-none">
                        <option value="ALL">Semua Kolom</option>
                    </select>
                </div>

                <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded shadow-sm overflow-hidden w-full">
                    <div class="overflow-x-auto custom-scrollbar max-h-[calc(100vh-180px)] min-h-[400px] relative w-full">
                        <table id="mainTable" class="border-collapse w-full">
                            <thead class="bg-slate-100 dark:bg-slate-700/95 sticky top-0 z-20 backdrop-blur-md border-b border-slate-200 dark:border-slate-600">
                                <tr id="tableHeader">
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="divide-y divide-slate-200 dark:divide-slate-700">
                            </tbody>
                        </table>
                    </div>

                    <div class="p-1 border-t border-slate-200 dark:border-slate-700 flex flex-col md:flex-row items-center justify-between gap-1 text-[9px] text-slate-500 dark:text-slate-400 w-full">
                        <div class="flex items-center gap-1">
                            <span>Tampilkan:</span>
                            <select id="pageSizeSelect" onchange="changePageSize()" class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded px-1 py-0.5 font-semibold text-slate-700 dark:text-slate-200 focus:outline-none text-[9px]">
                                <option value="100">100</option>
                                <option value="250">250</option>
                                <option value="500">500</option>
                                <option value="1000" selected>1.000</option>
                                <option value="2000">2.000</option>
                                <option value="3000">3.000</option>
                                <option value="5000">5.000</option>
                            </select>
                            <span>baris</span>
                        </div>

                        <div id="paginationInfo" class="font-medium">Menampilkan 0 dari 0 data</div>

                        <div class="flex items-center gap-0.5 overflow-x-auto max-w-full pb-0.5" id="paginationButtons">
                        </div>
                    </div>
                </div>

            </div>

        </main>
    </div>

    <script>
        let currentUserRole = null; 
        let currentAdminPassword = localStorage.getItem('sheetVisionAdminPass') || "admin123";

        let masterFilesData = {};
        let dbInstance = null;

        // Buka / Inisialisasi Database IndexedDB (Kapasitas Besar)
        function initIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("SheetVisionDB", 1);
                request.onupgradeneeded = function(e) {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains("store")) {
                        db.createObjectStore("store");
                    }
                };
                request.onsuccess = function(e) {
                    dbInstance = e.target.result;
                    resolve(dbInstance);
                };
                request.onerror = function(e) {
                    reject(e);
                };
            });
        }

        function saveMasterDataToDB(data) {
            if (!dbInstance) return;
            const transaction = dbInstance.transaction(["store"], "readwrite");
            const store = transaction.objectStore("store");
            store.put(data, "masterData");
        }

        function loadMasterDataFromDB() {
            return new Promise((resolve) => {
                if (!dbInstance) return resolve({});
                const transaction = dbInstance.transaction(["store"], "readonly");
                const store = transaction.objectStore("store");
                const request = store.get("masterData");
                request.onsuccess = function() {
                    resolve(request.result || {});
                };
                request.onerror = function() {
                    resolve({});
                };
            });
        }

        function clearMasterDataFromDB() {
            if (!dbInstance) return;
            const transaction = dbInstance.transaction(["store"], "readwrite");
            const store = transaction.objectStore("store");
            store.delete("masterData");
        }

        let currentActiveFile = "";
        let currentSheetName = "";
        let currentHeaders = [];
        let filteredData = [];
        let columnValueFilters = {}; 
        let columnSearchKeywords = {}; 
        let currentPage = 1;
        let pageSize = 1000;
        let sortColumn = null;
        let sortAsc = true;

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await initIndexedDB();
                masterFilesData = await loadMasterDataFromDB();
            } catch(e) {
                console.error("Gagal memuat DB", e);
            }
        });

        function switchLoginTab(role) {
            const adminBtn = document.getElementById('tabAdminBtn');
            const guestBtn = document.getElementById('tabGuestBtn');
            const adminSec = document.getElementById('adminFormSection');
            const guestSec = document.getElementById('guestFormSection');
            document.getElementById('loginErrorMsg').classList.add('hidden');

            if (role === 'admin') {
                adminBtn.className = "py-1 text-[10px] font-bold rounded-md bg-white dark:bg-slate-800 text-emerald-600 shadow-sm transition";
                guestBtn.className = "py-1 text-[10px] font-bold rounded-md text-slate-500 hover:text-slate-800 transition";
                adminSec.classList.remove('hidden');
                guestSec.classList.add('hidden');
            } else {
                guestBtn.className = "py-1 text-[10px] font-bold rounded-md bg-white dark:bg-slate-800 text-blue-600 shadow-sm transition";
                adminBtn.className = "py-1 text-[10px] font-bold rounded-md text-slate-500 hover:text-slate-800 transition";
                guestSec.classList.remove('hidden');
                adminSec.classList.add('hidden');
            }
        }

        function loginAsAdmin() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === currentAdminPassword) {
                currentUserRole = 'admin';
                initAppSession();
            } else {
                const err = document.getElementById('loginErrorMsg');
                err.innerText = "Password admin salah!";
                err.classList.remove('hidden');
            }
        }

        function loginAsGuest() {
            currentUserRole = 'guest';
            initAppSession();
        }

        function openPasswordModal() {
            document.getElementById('oldPasswordInput').value = '';
            document.getElementById('newPasswordInput').value = '';
            document.getElementById('passwordAlertMsg').classList.add('hidden');
            document.getElementById('passwordModal').classList.remove('hidden');
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.add('hidden');
        }

        function saveNewPassword() {
            const oldPass = document.getElementById('oldPasswordInput').value;
            const newPass = document.getElementById('newPasswordInput').value;
            const alertMsg = document.getElementById('passwordAlertMsg');

            if (oldPass !== currentAdminPassword) {
                alertMsg.innerText = "Password lama tidak sesuai!";
                alertMsg.className = "text-[10px] font-medium text-center text-red-500";
                alertMsg.classList.remove('hidden');
                return;
            }

            if (!newPass || newPass.length < 4) {
                alertMsg.innerText = "Password baru minimal 4 karakter!";
                alertMsg.className = "text-[10px] font-medium text-center text-red-500";
                alertMsg.classList.remove('hidden');
                return;
            }

            currentAdminPassword = newPass;
            localStorage.setItem('sheetVisionAdminPass', newPass);

            alertMsg.innerText = "Password admin berhasil diubah!";
            alertMsg.className = "text-[10px] font-medium text-center text-emerald-600";
            alertMsg.classList.remove('hidden');

            setTimeout(() => { closePasswordModal(); }, 1200);
        }

        async function initAppSession() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');

            const badge = document.getElementById('userRoleBadge');
            const toolbar = document.getElementById('adminToolbar');
            const sampleBtn = document.getElementById('sampleBtn');
            const settingPassBtn = document.getElementById('settingPasswordBtn');

            if (currentUserRole === 'admin') {
                badge.innerText = "Admin";
                badge.className = "text-[9px] px-1.5 py-0.2 rounded ml-1 bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 font-semibold";
                toolbar.classList.remove('hidden');
                sampleBtn.classList.remove('hidden');
                settingPassBtn.classList.remove('hidden');
            } else {
                badge.innerText = "Pengunjung";
                badge.className = "text-[9px] px-1.5 py-0.2 rounded ml-1 bg-blue-100 text-blue-800 dark:bg-blue-950 dark:text-blue-300 font-semibold";
                toolbar.classList.add('hidden'); 
                sampleBtn.classList.add('hidden');
                settingPassBtn.classList.add('hidden');
            }

            masterFilesData = await loadMasterDataFromDB();
            if (Object.keys(masterFilesData).length > 0) {
                initFileDropdown();
            }
        }

        function logout() {
            if (confirm("Keluar dari sesi saat ini?")) {
                currentUserRole = null;
                document.getElementById('adminPassword').value = "";
                document.getElementById('mainApp').classList.add('hidden');
                document.getElementById('loginPage').classList.remove('hidden');
            }
        }

        const fileInput = document.getElementById('fileInput');
        const jsonFileInput = document.getElementById('jsonFileInput');

        function triggerFileInput() { if(currentUserRole === 'admin') fileInput.click(); }
        function triggerJsonInput() { if(currentUserRole === 'admin') jsonFileInput.click(); }

        function handleFileSelect(e) {
            if (e.target.files && e.target.files.length > 0) processFiles(e.target.files);
        }

        function handleJsonSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const parsedData = JSON.parse(evt.target.result);
                    if (parsedData && typeof parsedData === 'object') {
                        masterFilesData = parsedData;
                        saveMasterDataToDB(masterFilesData);
                        hideAlert();
                        initFileDropdown();
                        showAlert("Berhasil memuat data JSON!", "success");
                    } else { showAlert("Format JSON tidak valid.", "error"); }
                } catch (err) { showAlert("Gagal memparsing JSON.", "error"); }
            };
            reader.readAsText(file);
        }

        function showAlert(msg, type = 'info') {
            const alertBox = document.getElementById('statusAlert');
            alertBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-emerald-100', 'text-emerald-700', 'bg-blue-100', 'text-blue-700');
            if (type === 'error') alertBox.classList.add('bg-red-100', 'text-red-700');
            else if (type === 'success') alertBox.classList.add('bg-emerald-100', 'text-emerald-700');
            else alertBox.classList.add('bg-blue-100', 'text-blue-700');
            alertBox.innerHTML = msg;
        }

        function hideAlert() { document.getElementById('statusAlert').classList.add('hidden'); }

        function clearData() {
            if (currentUserRole !== 'admin') return;
            if (confirm("Bersihkan tampilan dan seluruh data?")) {
                masterFilesData = {};
                clearMasterDataFromDB();
                currentActiveFile = "";
                currentSheetName = "";
                document.getElementById('navBarContainer').classList.add('hidden');
                document.getElementById('contentArea').classList.add('hidden');
                showAlert("Tampilan dan database dibersihkan.", "success");
            }
        }

        function processFiles(files) {
            if (typeof XLSX === 'undefined') { showAlert('Library Excel gagal dimuat.', 'error'); return; }
            showAlert('<i class="fa-solid fa-spinner fa-spin mr-1"></i> Membaca seluruh file Excel...', 'info');
            let filesLoaded = 0;
            const totalFiles = files.length;

            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        let fileSheets = {};
                        workbook.SheetNames.forEach(sheetName => {
                            const worksheet = workbook.Sheets[sheetName];
                            const rawJson = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                            if (rawJson && rawJson.length > 0) fileSheets[sheetName] = cleanAndStructureData(rawJson);
                        });
                        masterFilesData[file.name] = fileSheets;
                        filesLoaded++;
                        if (filesLoaded === totalFiles) {
                            saveMasterDataToDB(masterFilesData);
                            hideAlert();
                            initFileDropdown();
                            showAlert(`Berhasil memproses ${totalFiles} file Excel!`, "success");
                        }
                    } catch (err) { showAlert(`Gagal membaca file ${file.name}: ${err.message}`, 'error'); }
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function cleanAndStructureData(rawRows) {
            if (!rawRows || rawRows.length === 0) return [];
            let headerIndex = 0;
            let maxScore = -1;

            for (let i = 0; i < Math.min(35, rawRows.length); i++) {
                if (rawRows[i] && Array.isArray(rawRows[i])) {
                    const rowStr = rawRows[i].map(c => c !== null && c !== undefined ? String(c) : '').join(' ').toLowerCase();
                    if (/^\(\d+\)(\s+\(\d+\))*$/.test(rowStr.replace(/\s+/g, ' ').trim())) continue;
                    let score = 0;
                    if (rowStr.includes('no') || rowStr.includes('nomor')) score += 2;
                    if (rowStr.includes('uraian') || rowStr.includes('informasi') || rowStr.includes('perihal')) score += 3;
                    if (score > maxScore) { maxScore = score; headerIndex = i; }
                }
            }

            const headers = (rawRows[headerIndex] || []).map((h, idx) => (h !== null && h !== undefined && String(h).trim() !== '') ? String(h).trim() : `Kolom_${idx + 1}`);
            const structuredData = [];
            let rowCounter = 1;

            for (let i = headerIndex + 1; i < rawRows.length; i++) {
                const currentRow = rawRows[i];
                if (!currentRow || !Array.isArray(currentRow)) continue;
                const rowCombinedStr = currentRow.map(c => c !== null && c !== undefined ? String(c) : '').join(' ').toLowerCase().trim();
                if (rowCombinedStr === '') continue;

                const rowObj = {};
                let hasData = false;
                headers.forEach((header, colIdx) => {
                    const val = currentRow[colIdx];
                    if (val !== undefined && val !== null && String(val).trim() !== '') {
                        hasData = true;
                        rowObj[header] = val;
                    } else { rowObj[header] = ""; }
                });

                if (hasData) {
                    const noHeaderKey = headers.find(h => { const l = String(h).toLowerCase(); return l === 'no.' || l === 'no' || l === 'nomor'; });
                    if (noHeaderKey && (String(rowObj[noHeaderKey]).trim() === '' || String(rowObj[noHeaderKey]) === '0')) {
                        rowObj[noHeaderKey] = rowCounter;
                    }
                    structuredData.push(rowObj);
                    rowCounter++;
                }
            }
            return structuredData;
        }

        function initFileDropdown() {
            const fileNames = Object.keys(masterFilesData);
            if (fileNames.length === 0) return;
            const dropdown = document.getElementById('fileDropdown');
            dropdown.innerHTML = '';
            fileNames.forEach((fileName) => {
                const opt = document.createElement('option');
                opt.value = fileName; opt.innerText = fileName;
                dropdown.appendChild(opt);
            });
            document.getElementById('navBarContainer').classList.remove('hidden');
            document.getElementById('navBarContainer').classList.add('flex');
            switchFile(fileNames[0]);
        }

        function onFileDropdownChange(event) { switchFile(event.target.value); }
        function switchFile(fileName) { currentActiveFile = fileName; initSheetTabsForFile(fileName); }

        function initSheetTabsForFile(fileName) {
            const fileSheets = masterFilesData[fileName] || {};
            const sheetNames = Object.keys(fileSheets);
            if (sheetNames.length === 0) return;

            const sheetTabsContainer = document.getElementById('sheetTabs');
            sheetTabsContainer.innerHTML = '';

            sheetNames.forEach((sheetName, index) => {
                const count = (fileSheets[sheetName] || []).length;
                const btn = document.createElement('button');
                btn.className = `px-2 py-1 rounded text-[10px] font-semibold transition-all duration-150 flex items-center gap-1 shadow-sm border ${
                    index === 0 ? 'bg-emerald-600 text-white border-emerald-600' : 'bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-100'
                }`;
                btn.onclick = () => switchSheet(sheetName, btn);
                btn.innerHTML = `<i class="fa-solid fa-table text-[8px]"></i><span>${sheetName}</span><span class="px-1 rounded-full text-[8px] ${index === 0 ? 'bg-emerald-700 text-emerald-100' : 'bg-slate-200 dark:bg-slate-700 text-slate-600'}">${count.toLocaleString('id-ID')}</span>`;
                sheetTabsContainer.appendChild(btn);
            });

            document.getElementById('contentArea').classList.remove('hidden');
            switchSheet(sheetNames[0], sheetTabsContainer.children[0]);
        }

        function switchSheet(sheetName, activeBtn) {
            currentSheetName = sheetName;
            const buttons = document.getElementById('sheetTabs').children;
            Array.from(buttons).forEach(btn => {
                btn.className = 'px-2 py-1 rounded text-[10px] font-semibold transition-all duration-150 flex items-center gap-1 shadow-sm border bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:bg-slate-100';
            });
            if(activeBtn) activeBtn.className = 'px-2 py-1 rounded text-[10px] font-semibold transition-all duration-150 flex items-center gap-1 shadow-sm border bg-emerald-600 text-white border-emerald-600';

            const data = (masterFilesData[currentActiveFile] || {})[sheetName] || [];
            currentHeaders = data.length > 0 ? Object.keys(data[0]) : [];

            const filterSelect = document.getElementById('columnFilter');
            filterSelect.innerHTML = '<option value="ALL">Semua Kolom</option>';
            currentHeaders.forEach(header => {
                const opt = document.createElement('option');
                opt.value = header; opt.innerText = header;
                filterSelect.appendChild(opt);
            });

            document.getElementById('searchInput').value = '';
            columnValueFilters = {}; columnSearchKeywords = {}; currentPage = 1; sortColumn = null; sortAsc = true;
            applySearchAndFilter();
        }

        function applySearchAndFilter() {
            const globalQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            const globalCol = document.getElementById('columnFilter').value;
            const originalData = (masterFilesData[currentActiveFile] || {})[currentSheetName] || [];

            filteredData = originalData.filter(row => {
                if (globalQuery) {
                    if (globalCol !== 'ALL') {
                        if (!String(row[globalCol] || '').toLowerCase().includes(globalQuery)) return false;
                    } else {
                        const matchGlobal = Object.values(row).some(val => String(val || '').toLowerCase().includes(globalQuery));
                        if (!matchGlobal) return false;
                    }
                }
                return true;
            });

            if (sortColumn) {
                filteredData.sort((a, b) => {
                    let valA = a[sortColumn] ?? ''; let valB = b[sortColumn] ?? '';
                    const numA = parseFloat(valA); const numB = parseFloat(valB);
                    if (!isNaN(numA) && !isNaN(numB)) return sortAsc ? numA - numB : numB - numA;
                    return sortAsc ? String(valA).localeCompare(String(valB)) : String(valB).localeCompare(String(valA));
                });
            }
            renderTable();
        }

        function onSearchInput() { currentPage = 1; applySearchAndFilter(); }
        function defIsResizableColumn(colName) {
            const name = String(colName).toLowerCase();
            return name.includes('uraian') || name.includes('informasi') || name.includes('perihal');
        }

        function renderTable() {
            const headerTr = document.getElementById('tableHeader');
            const bodyTbody = document.getElementById('tableBody');

            headerTr.innerHTML = currentHeaders.map(col => {
                const isResizable = defIsResizableColumn(col);
                return `<th class="border-r border-slate-200 dark:border-slate-600 ${isResizable ? 'col-resizable' : 'col-standard'}"><div class="py-1 text-center font-bold text-[10px]">${col}</div></th>`;
            }).join('');

            const startIdx = (currentPage - 1) * pageSize;
            const endIdx = startIdx + pageSize;
            const pageData = filteredData.slice(startIdx, endIdx);

            if (pageData.length === 0) {
                bodyTbody.innerHTML = `<tr><td colspan="${currentHeaders.length || 1}" class="text-center py-8 text-slate-400">Data tidak ditemukan.</td></tr>`;
            } else {
                bodyTbody.innerHTML = pageData.map((row, idx) => `
                    <tr class="${idx % 2 === 0 ? 'bg-white dark:bg-slate-800' : 'bg-slate-50/50 dark:bg-slate-800/40'}">
                        ${currentHeaders.map(col => {
                            const val = row[col] !== undefined ? String(row[col]) : '';
                            return `<td class="text-slate-700 dark:text-slate-200 border-r border-slate-100 ${defIsResizableColumn(col) ? 'col-resizable' : 'col-standard'}">${val}</td>`;
                        }).join('')}
                    </tr>
                `).join('');
            }
            renderPaginationControls();
        }

        function renderPaginationControls() {
            const totalPages = Math.ceil(filteredData.length / pageSize) || 1;
            const startIdx = filteredData.length > 0 ? (currentPage - 1) * pageSize + 1 : 0;
            const endIdx = Math.min(currentPage * pageSize, filteredData.length);
            document.getElementById('paginationInfo').innerText = `Menampilkan ${startIdx}-${endIdx} dari ${filteredData.length} data`;
        }

        function changePageSize() {
            pageSize = parseInt(document.getElementById('pageSizeSelect').value, 10);
            currentPage = 1; renderTable();
        }

        function exportData(type) {
            if (currentUserRole !== 'admin') return;
            if (filteredData.length === 0) { alert('Tidak ada data.'); return; }
            const ws = XLSX.utils.json_to_sheet(filteredData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, currentSheetName || "Data");
            if (type === 'xlsx') XLSX.writeFile(wb, `${currentSheetName}_Export.xlsx`);
            else if (type === 'csv') XLSX.writeFile(wb, `${currentSheetName}_Export.csv`, { bookType: 'csv' });
            else if (type === 'json') {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(masterFilesData, null, 2));
                const a = document.createElement('a'); a.href = dataStr; a.download = "Master_Backup.json"; a.click();
            }
        }

        function loadSampleData() {
            if (currentUserRole !== 'admin') return;
            const sheet1Data = [];
            for (let i = 1; i <= 25; i++) {
                sheet1Data.push({ "No.": i, "Uraian Informasi": `Arsip Dokumen Contoh ${i}`, "Kurun Waktu": "2026", "Jumlah": "1 Berkas" });
            }
            masterFilesData = {
                "LAPORAN KEARSIPAN 2026.xlsx": { "RekapUtama": sheet1Data, "ArsipMasuk": sheet1Data },
                "DATA INAKTIF PUSAT.xlsx": { "Data2026": sheet1Data }
            };
            saveMasterDataToDB(masterFilesData);
            initFileDropdown();
        }

        function toggleDarkMode() { document.documentElement.classList.toggle('dark'); }
    </script>
</body>
